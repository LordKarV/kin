[project]
name = "kin-backend"
version = "0.1.0"
description = "KIN: live call interpreter with a common-ground engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "openai>=1.40",
  "httpx>=0.27",
  "websockets>=12",
  "rapidfuzz>=3.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
livekit = ["livekit==1.1.21", "livekit-api==1.2.2"]  # KIN call app: app/rtc/agent.py (rtc SDK, not livekit-agents)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]
