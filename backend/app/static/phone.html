<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1e21" />
  <title>KIN live call</title>
  <style>
    /* Meta palette: Meta Blue #0064E0, light blue on dark #47A5FA, near-black #1C1E21, Meta status colors */
    :root { --bg: #18191a; --panel: #242526; --fg: #e4e6eb; --muted: #b0b3b8; --line: #3a3b3c; --blue: #0064e0; --light: #47a5fa; --pass: #f7b928; --ok: #31a24c; --err: #e41e3f;
            font-family: "Optimistic VF", "Optimistic Text", Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Noto Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); padding: max(16px, env(safe-area-inset-top)) 16px 96px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header b { font-size: 20px; letter-spacing: 0.04em; }
    #state { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .empty { color: var(--muted); text-align: center; margin-top: 30vh; line-height: 1.5; }
    .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; }
    .turn.me { background: transparent; }
    .who { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--light); margin-bottom: 4px; }
    .turn.me .who { color: var(--muted); }
    .tr { font-size: 20px; line-height: 1.35; }
    .turn.me .tr { font-size: 17px; }
    .src { font-size: 14px; color: var(--muted); margin-top: 6px; }
    mark.pass { background: none; color: var(--pass); border-bottom: 1px dotted var(--pass); }
    .card { margin-top: 10px; border-radius: 14px; padding: 10px 12px; background: rgba(71, 165, 250, 0.1); }
    .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--light); }
    .card.what .k { color: var(--pass); }
    .card .t { font-weight: 600; margin-top: 2px; }
    .card .m { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .card .chip { display: inline-block; padding: 2px 8px; border-radius: 100px; background: rgba(71, 165, 250, 0.16); }
    .card.what .chip, .card.term .chip { background: rgba(247, 185, 40, 0.16); }
    .card .n { font-weight: 400; color: var(--muted); }
    .card .c { font-size: 11px; color: var(--muted); opacity: 0.8; margin-top: 4px; }
    .card.info { padding-top: 8px; }
    .card .pic { aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--line); margin-bottom: 8px; }
    .card .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card .pic.skeleton { background: linear-gradient(100deg, #3a3b3c 40%, #4e4f50 50%, #3a3b3c 60%) 0 0 / 200% 100%; animation: shimmer 1.2s linear infinite; }
    .card.person { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
    .card .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(90deg, #0064e0, #0082fb); color: #fff; font-weight: 700; }
    #heard { margin-bottom: 12px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .card .pic.skeleton { animation: none; } }
  </style>
</head>
<body>
  <header><b>KIN</b><span id="state"><span id="dot" class="dot"></span><span id="label">Waiting for a call</span></span></header>
  <div id="heard" class="turn" hidden><div class="who">Heard just now</div><div class="cards"></div></div>
  <div id="feed"><p class="empty">Call your grandparent, tap <b>Add call</b>, dial KIN, then <b>Merge</b>.<br />Captions and cards show up here.</p></div>
  <script>
    // Follows the newest merged call (or ?call=N) and shows what KIN hears and says, with who/what cards.
    const params = new URLSearchParams(location.search)
    const key = params.get('key') || ''
    const q = key ? `?key=${encodeURIComponent(key)}` : ''
    const feed = document.getElementById('feed')
    const names = {}
    let lang = ''
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
    const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    function setState(text, on) { document.getElementById('label').textContent = text; document.getElementById('dot').classList.toggle('on', !!on) }

    function translationHtml(t) {
      const pts = (t.passthrough || []).filter(Boolean)
      if (!pts.length) return esc(t.translation)
      const re = new RegExp(`(${pts.map(reEsc).join('|')})`, 'g')
      return (t.translation || '').split(re).map((p) => pts.includes(p) ? `<mark class="pass">${esc(p)}</mark>` : esc(p)).join('')
    }
    // ---- cards: instant `glance` items, `glance_image` pictures, late `enrich` idiom cards ----------------------
    // Glance cards wait in "Heard just now" and move into the grandparent turn when its transcript lands.
    const PICTURE_CATS = new Set(['food', 'festival', 'ritual', 'place', 'object'])
    const CHIP = { saying: 'Saying', address: 'Address', idiom: 'Idiom', proverb: 'Saying', register: 'Address', honorific: 'Address', cultural: 'Culture' }
    const SKELETON_MS = 6000
    const norm = (s) => String(s ?? '').trim().toLowerCase()
    const heard = document.querySelector('#heard .cards')
    const shown = new Set()   // card keys and `title:` keys already on the page
    const items = new Map()   // key -> item, for glance_image updates
    const turns = new Map()   // utterance_id -> turn element, for enrich
    let lastGp = null

    function layoutFor(it) {
      if (it.kind === 'who') return 'person'
      if (PICTURE_CATS.has(it.category) || ((it.kind === 'what' || it.kind === 'term') && it.image_url)) return 'info'
      return 'compact'
    }
    function chipFor(it, layout) {
      if (it.kind === 'ask') return 'New relative'
      if (layout === 'person') return 'Who is this'
      if (layout === 'info') return it.category ? it.category[0].toUpperCase() + it.category.slice(1) : 'What is this'
      return CHIP[it.category] || CHIP[it.kind] || (it.kind === 'what' ? 'What is this' : 'Culture')
    }
    function cardHtml(it) {
      const layout = layoutFor(it)
      const native = it.native && norm(it.native) !== norm(it.title) ? ` <span class="n">${esc(it.native)}</span>` : ''
      const title = it.kind === 'ask' ? `Who is \u2018${esc([it.guess, it.term || it.title].filter(Boolean).join(' '))}\u2019?` : esc(it.title) + native
      const text = `<div class="k"><span class="chip">${esc(chipFor(it, layout))}</span></div><div class="t">${title}</div>`
        + (it.body ? `<div class="m">${esc(it.body)}</div>` : '')
        + (it.literal ? `<div class="m">Literally: ${esc(it.literal)}</div>` : '')
        + (it.why ? `<div class="m">${esc(it.why)}</div>` : '')
      if (layout === 'person') return { layout, html: `<div class="av">${esc([...(it.title || '?')][0].toUpperCase())}</div><div>${text}</div>` }
      if (layout !== 'info') return { layout, html: text }
      const pic = /^https:\/\//i.test(it.image_url || '') ? `<div class="pic"><img loading="lazy" alt="" src="${esc(it.image_url)}" /></div>` : '<div class="pic skeleton"></div>'
      const credit = [it.image_credit, it.source_url && 'Wikipedia'].filter(Boolean).join(' / ')
      return { layout, html: pic + text + (credit ? `<div class="c">${esc(credit)}</div>` : '') }
    }
    function fill(el, it) {
      const { layout, html } = cardHtml(it)
      el.className = `card ${layout} ${it.kind}`
      el.innerHTML = html
      const img = el.querySelector('.pic img')
      if (img) img.onerror = () => img.parentElement.remove()  // a broken picture leaves a complete text card
      const sk = el.querySelector('.pic.skeleton')
      if (sk) setTimeout(() => { if (sk.isConnected && sk.classList.contains('skeleton')) sk.remove() }, SKELETON_MS)
    }
    function cardEl(it) {
      const el = document.createElement('div')
      el.dataset.key = it.key
      fill(el, it)
      return el
    }
    // true the first time a key (and its heard title) shows up
    function claim(key, title) {
      if (shown.has(key) || (title && shown.has(`title:${norm(title)}`))) return false
      shown.add(key)
      if (title) shown.add(`title:${norm(title)}`)
      return true
    }
    function onGlance(m) {
      for (const it of m.items || []) {
        if (!it?.key) continue
        const key = it.kind === 'ask' ? `ask:${norm(it.term || it.title)}` : it.key
        if (!claim(key, it.kind === 'ask' ? '' : it.title)) continue
        items.set(it.key, it)
        heard.prepend(cardEl(it))
      }
      document.getElementById('heard').hidden = !heard.children.length
    }
    function onImage(m) {
      const it = items.get(m.key)
      if (!it) return
      const next = { ...it, image_url: m.image_url || it.image_url, image_credit: m.image_credit || it.image_credit, source_url: m.source_url || it.source_url, body: it.body || m.body || '' }
      items.set(m.key, next)
      document.querySelectorAll('[data-key]').forEach((el) => { if (el.dataset.key === m.key) fill(el, next) })
    }
    function pragCards(cards) {
      return (cards || []).filter((c) => claim(`card:${c.kind}:${c.source}`, c.source))
        .map((c) => cardEl({ key: `card:${c.kind}:${c.source}`, kind: c.kind, title: c.source, body: c.meaning, literal: c.literal, why: c.why_it_matters }))
    }
    function onEnrich(m) {
      const box = turns.get(m.utterance_id)?.querySelector('.cards') || lastGp?.querySelector('.cards') || heard
      box.append(...pragCards(m.pragmatics_cards))
      if (box === heard) document.getElementById('heard').hidden = !heard.children.length
    }
    // grandparent turn: glance cards heard so far move in; grounded spans only fill gaps the glance missed
    function turnCards(t, box) {
      box.append(...[...heard.children].reverse())
      document.getElementById('heard').hidden = true
      for (const g of t.grounded_spans || []) {
        if (norm(g.rendered) === norm(g.source)) continue
        const who = String(g.node_id).startsWith('p_')
        const key = who ? String(g.node_id) : `thing:${g.node_id}`
        if (claim(key, g.source)) box.append(cardEl({ key, kind: who ? 'who' : 'what', title: g.source, body: g.rendered }))
      }
      box.append(...pragCards(t.pragmatics_cards))
    }
    function add(t) {
      if (feed.querySelector('.empty')) feed.innerHTML = ''
      const me = t.role === 'grandchild'
      const el = document.createElement('div')
      el.className = `turn${me ? ' me' : ''}`
      el.innerHTML = me
        ? `<div class="who">You said, KIN told ${esc(names[t.listener] || 'them')} in ${esc(lang)}</div><div class="tr">${esc(t.translation)}</div><div class="src">${esc(t.src_text)}</div>`
        : `<div class="who">${esc(names[t.speaker] || t.speaker)}</div><div class="tr">${translationHtml(t)}</div><div class="src">${esc(t.src_text)}</div><div class="cards"></div>`
      if (!me) {
        turnCards(t, el.querySelector('.cards'))
        lastGp = el
        if (t.utterance_id != null) turns.set(t.utterance_id, el)
      }
      feed.prepend(el)
    }

    async function follow() {
      try {
        const g = await (await fetch(`/api/family/graph${q}`)).json()
        g.people.forEach((p) => { names[p.id] = p.name })
        lang = new Intl.DisplayNames(['en'], { type: 'language' }).of(g.heritage_lang) || g.heritage_lang
      } catch { /* names are cosmetic */ }
      let id = Number(params.get('call')) || null
      while (!id) {
        try { id = (await (await fetch(`/api/phone/live${q}`)).json()).call_id } catch { /* retry */ }
        if (!id) await new Promise((r) => setTimeout(r, 2000))
      }
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/watch/${id}${q}`)
      ws.onopen = () => setState(`Live, call #${id}`, true)
      ws.onmessage = (e) => {
        let m
        try { m = JSON.parse(e.data) } catch { return }
        if (m.type === 'transcript') add(m)
        else if (m.type === 'glance' && m.role === 'grandparent') onGlance(m)
        else if (m.type === 'glance_image') onImage(m)
        else if (m.type === 'enrich') onEnrich(m)
      }
      ws.onclose = () => { setState('Call ended, waiting for the next one', false); setTimeout(follow, 2000) }
    }
    follow()
  </script>
</body>
</html>
