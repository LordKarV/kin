<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- img-src https: lets Wikipedia pictures load; scripts stay 'self' only -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #stack { display: flex; flex-direction: column; gap: 10px; padding: 8px; }
    .card { padding: 14px 16px 16px; display: grid; gap: 6px; animation: in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .card .kind { display: flex; align-items: center; gap: 8px; margin: -4px -6px 0 0; font-size: 12px; font-weight: 600; color: var(--light-blue); }
    .card .kind button { margin-left: auto; }
    .card .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--r-pill); background: rgba(71, 165, 250, 0.14); }
    .card .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .card.what .kind, .card.term .kind { color: var(--pass); }
    .card.what .chip, .card.term .chip { background: rgba(247, 185, 40, 0.14); }
    .card.ask .kind { color: #fff; }
    .card.ask .chip { background: var(--field); }
    .card.ask .chip::before { background: var(--gradient); width: 8px; height: 8px; }
    .card .title { font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
    .card .native { font-weight: 500; color: var(--muted); }
    .card .body { font-size: 14px; line-height: 1.45; }
    .card .why, .card .credit { font-size: 12px; line-height: 1.4; color: var(--muted); }
    .card .credit { font-size: 11px; opacity: 0.8; }

    /* picture bubble: image on top, then chip, title, body, credit */
    .card.info { padding-top: 10px; }
    .card .pic { margin: 0 -6px 4px; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--field); }
    .card .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card .pic.skeleton { background: linear-gradient(100deg, var(--field) 40%, var(--field-hover) 50%, var(--field) 60%) 0 0 / 200% 100%; animation: shimmer 1.2s linear infinite; }

    /* people: initial avatar beside the relation */
    .card.person { grid-template-columns: 40px 1fr; align-items: start; gap: 12px; }
    .card.person .main { display: grid; gap: 4px; min-width: 0; }
    .card .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--gradient); color: #fff; font-size: 17px; font-weight: 700; }

    .card.ask { gap: 10px; }
    .card.ask form { display: grid; gap: 10px; }
    .card .done { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); }
    .card .done svg { width: 18px; height: 18px; color: var(--ok); flex: 0 0 auto; }
    @keyframes in { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>
  <div id="stack" aria-live="polite"></div>
  <script type="module" src="cards.js"></script>
</body>
</html>
