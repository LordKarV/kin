# Source of truth for the Xcode project: `cd ios && xcodegen generate` (XcodeGen 2.46). Never hand-edit Kin.xcodeproj.
name: Kin
options:
  bundleIdPrefix: dev.kin
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.17.0
targets:
  Kin:
    type: application
    platform: iOS
    sources:
      - path: Kin/Sources
      - path: Kin/Resources
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kin.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Kin/Resources/Assets.xcassets is a copy of design/brand/Assets.xcassets (the design session owns the source).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Demo phone defaults (SignupView): empty means a normal build. Set on the xcodebuild command line.
        KIN_DEFAULT_SERVER: ""
        KIN_DEFAULT_NAME: ""
        KIN_DEFAULT_LANG: ""
        KIN_DEFAULT_SIGNIN: ""
    info:
      path: Kin/Resources/Info.plist
      properties:
        CFBundleDisplayName: KIN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        KINDefaultServer: "$(KIN_DEFAULT_SERVER)"
        KINDefaultName: "$(KIN_DEFAULT_NAME)"
        KINDefaultLang: "$(KIN_DEFAULT_LANG)"
        KINDefaultSignin: "$(KIN_DEFAULT_SIGNIN)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: KIN uses the microphone so the people you call can hear you.
        NSCameraUsageDescription: KIN uses the camera so the people you call can see you.
        NSContactsUsageDescription: KIN checks which of your contacts are on KIN. Numbers are hashed on your phone and never stored.
        NSLocalNetworkUsageDescription: KIN connects to a KIN server on your local network (development builds).
        # Demo build: plain http to a laptop on a hotspot (IPv6) or the Vultr IP. ATS blocks those even though they are
        # IP literals, and NSAllowsLocalNetworking would make iOS ignore NSAllowsArbitraryLoads. Use HTTPS (domain + Caddy)
        # before any real release.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.kin.join
            CFBundleURLSchemes: [kin]
schemes:
  Kin:
    build:
      targets:
        Kin: all
